name: Promote to Member Team

on:
  pull_request:
    types: [closed]
    paths:
      - 'membersmap/**'
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Merged member-map pull request to retry
        required: true
        type: number

jobs:
  promote-to-member:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Load and Validate Member Map PR
        id: load_pr
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              throw new Error('A valid merged pull request number is required.');
            }

            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            if (!pullRequest.data.merged_at) {
              throw new Error(`Pull request #${prNumber} has not been merged.`);
            }

            const username = pullRequest.data.user.login;
            const validUsername = /^[a-z\d](?:[a-z\d-]{0,37}[a-z\d])?$/i;
            if (!validUsername.test(username)) {
              throw new Error(`Pull request #${prNumber} has an invalid author username.`);
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const expectedProfiles = [
              `membersmap/${username}.md`.toLowerCase(),
              `membersmap/${username}.json`.toLowerCase()
            ];
            const memberProfile = files.find(file =>
              file.status === 'added' &&
              expectedProfiles.includes(file.filename.toLowerCase())
            );
            if (!memberProfile) {
              throw new Error(
                `Pull request #${prNumber} did not add a member profile for its author, ${username}.`
              );
            }

            core.setOutput('author', username);
            core.setOutput('pull_request_number', prNumber.toString());
            console.log(`Validated ${memberProfile.filename} from merged PR #${prNumber}`);

      - name: Get Team IDs
        id: get_team_ids
        if: steps.load_pr.outcome == 'success'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const orgName = 'Cloud-Native-Security-Pakistan';
            
            try {
              // Get all teams
              const teams = await github.paginate(github.rest.teams.list, {
                org: orgName
              });
              
              // Find Newbie and Member teams
              const newbieTeam = teams.find(t => 
                t.name.toLowerCase() === 'newbie' || t.slug.toLowerCase() === 'newbie'
              );
              const memberTeam = teams.find(t => 
                t.name.toLowerCase() === 'member' || t.slug.toLowerCase() === 'member'
              );
              
              if (newbieTeam) {
                core.setOutput('newbie_team_id', newbieTeam.id.toString());
                console.log(`Found Newbie team: ${newbieTeam.name} (ID: ${newbieTeam.id})`);
              }
              
              if (memberTeam) {
                core.setOutput('member_team_id', memberTeam.id.toString());
                console.log(`Found Member team: ${memberTeam.name} (ID: ${memberTeam.id})`);
              } else {
                throw new Error('Member team not found.');
              }
              
            } catch (error) {
              console.error(`Error getting teams: ${error.message}`);
              throw error;
            }

      - name: Promote User to Member Team
        id: promote_user
        if: |
          steps.load_pr.outcome == 'success' &&
          steps.get_team_ids.outputs.member_team_id != ''
        uses: actions/github-script@v8
        env:
          PROMOTION_USERNAME: ${{ steps.load_pr.outputs.author }}
          NEWBIE_TEAM_ID: ${{ steps.get_team_ids.outputs.newbie_team_id }}
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const orgName = 'Cloud-Native-Security-Pakistan';
            const username = process.env.PROMOTION_USERNAME;
            const newbieTeamId = process.env.NEWBIE_TEAM_ID;
            
            console.log(`Promoting ${username} to Member team...`);
            
            try {
              // Add user to Member team
              await github.rest.teams.addOrUpdateMembershipForUserInOrg({
                org: orgName,
                team_slug: 'member', // Use slug, will work with ID too
                username: username,
                role: 'member'
              });
              
              console.log(`Successfully added ${username} to Member team`);
              
              // Optionally remove from Newbie team if they're in it
              if (newbieTeamId && newbieTeamId !== '') {
                try {
                  await github.rest.teams.removeMembershipForUserInOrg({
                    org: orgName,
                    team_slug: 'newbie',
                    username: username
                  });
                  console.log(`Removed ${username} from Newbie team`);
                } catch (error) {
                  console.log(`Could not remove from Newbie team (may not be in it): ${error.message}`);
                }
              }
              
              return { success: true };
            } catch (error) {
              console.error(`Error promoting user: ${error.message}`);
              const message = String(error.message || '').toLowerCase();

              if (message.includes('already') && message.includes('member')) {
                console.log(`User ${username} is already in Member team`);
                return { success: true, alreadyMember: true };
              }
              
              throw error;
            }

      - name: Post Congratulations Comment
        if: steps.promote_user.outcome == 'success'
        uses: actions/github-script@v8
        env:
          PROMOTED_USERNAME: ${{ steps.load_pr.outputs.author }}
          PR_NUMBER: ${{ steps.load_pr.outputs.pull_request_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = process.env.PROMOTED_USERNAME;
            const prNumber = Number(process.env.PR_NUMBER);
            
            const comment = `## 🎉 Congratulations @${username}!
            
            Your member profile has been added to the CNSP member map! 
            
            ### What Happened:
            - ✅ Your PR has been merged
            - ✅ You've been promoted from **Newbie** to **Member** team
            - ✅ You now have access to member-only resources and channels
            - ⭐ **Bonus**: You earned extra points for submitting via GitHub PR!
            
            ### Next Steps:
            - Explore member-only resources and channels
            - Start contributing to projects to advance to **Contributor**!
            - Check out our [README](https://github.com/Cloud-Native-Security-Pakistan/becoming-a-member#-team-structure--progression) to see how to advance further
            
            Welcome to the Member team! 🚀

            <!-- cnsp-promotion-status -->`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const existingComment = comments.find(candidate =>
              candidate.user.type === 'Bot' &&
              candidate.body?.includes('<!-- cnsp-promotion-status -->')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }

            console.log(`Updated promotion status on PR #${prNumber}`);

