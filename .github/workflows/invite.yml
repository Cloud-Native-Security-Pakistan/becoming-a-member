name: Auto Invite to Organization

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing invite-request issue to retry
        required: true
        type: number

concurrency:
  group: invite-request-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  invite:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'invite-request')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Load Invitation Request
        id: load_request
        uses: actions/github-script@v8
        env:
          RETRY_ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let issue = context.payload.issue;

            if (context.eventName === 'workflow_dispatch') {
              const issueNumber = Number(process.env.RETRY_ISSUE_NUMBER);
              if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
                throw new Error('A valid invite-request issue number is required.');
              }

              const response = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = response.data;
            }

            if (!issue || issue.pull_request) {
              throw new Error('The requested item is not an issue.');
            }

            core.setOutput('issue_number', issue.number.toString());

            const labels = issue.labels.map(label =>
              typeof label === 'string' ? label : label.name
            );
            if (!labels.includes('invite-request')) {
              throw new Error(`Issue #${issue.number} does not have the invite-request label.`);
            }

            const lines = (issue.body || '').split(/\r?\n/);
            const headingIndex = lines.findIndex(line =>
              line.trim().toLowerCase() === '### github username'
            );
            const rawUsername = headingIndex >= 0
              ? lines.slice(headingIndex + 1).find(line => line.trim() !== '')
              : undefined;
            const username = (rawUsername || '').trim().replace(/^@/, '');

            // GitHub usernames are 1-39 alphanumeric/hyphen characters and
            // cannot begin or end with a hyphen.
            const validUsername = /^[a-z\d](?:[a-z\d-]{0,37}[a-z\d])?$/i;
            if (!validUsername.test(username)) {
              throw new Error(`Issue #${issue.number} does not contain a valid GitHub username.`);
            }

            core.setOutput('username', username);
            core.setOutput('request_validated', 'true');
            console.log(`Loaded invite request #${issue.number} for ${username}`);

      - name: Get Configured Team ID
        id: get_team_id
        uses: actions/github-script@v8
        env:
          DEFAULT_TEAM_NAME: ${{ secrets.DEFAULT_TEAM_NAME }}
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const orgName = 'Cloud-Native-Security-Pakistan';
            const teamName = (process.env.DEFAULT_TEAM_NAME || '').trim();

            if (!teamName) {
              console.log('DEFAULT_TEAM_NAME is not set; the invite step will look for the Newbie team.');
              core.setOutput('team_id', '');
              return;
            }

            try {
              const teams = await github.paginate(github.rest.teams.list, {
                org: orgName
              });
              const normalizedTeamName = teamName.toLowerCase();
              const team = teams.find(candidate =>
                candidate.name.toLowerCase() === normalizedTeamName ||
                candidate.slug.toLowerCase() === normalizedTeamName
              );

              if (team) {
                console.log(`Found team "${teamName}" with ID ${team.id}`);
                core.setOutput('team_id', team.id.toString());
              } else {
                console.log(`Configured team "${teamName}" was not found; falling back to Newbie.`);
                core.setOutput('team_id', '');
              }
            } catch (error) {
              console.log(`Could not fetch configured team: ${error.message}`);
              core.setOutput('team_id', '');
            }

      - name: Invite User to Organization
        id: invite_user
        uses: actions/github-script@v8
        env:
          INVITE_USERNAME: ${{ steps.load_request.outputs.username }}
          DEFAULT_TEAM_ID: ${{ secrets.DEFAULT_TEAM_ID }}
          LOOKED_UP_TEAM_ID: ${{ steps.get_team_id.outputs.team_id }}
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const username = process.env.INVITE_USERNAME;
            const orgName = 'Cloud-Native-Security-Pakistan';
            let teamIdValue = (process.env.DEFAULT_TEAM_ID || '').trim() ||
              (process.env.LOOKED_UP_TEAM_ID || '').trim();

            if (!teamIdValue) {
              try {
                const teams = await github.paginate(github.rest.teams.list, {
                  org: orgName
                });
                const newbieTeam = teams.find(team =>
                  team.name.toLowerCase() === 'newbie' ||
                  team.slug.toLowerCase() === 'newbie'
                );
                if (newbieTeam) {
                  teamIdValue = newbieTeam.id.toString();
                  console.log(`Found Newbie team with ID ${newbieTeam.id}`);
                }
              } catch (error) {
                console.log(`Could not find the Newbie team: ${error.message}`);
              }
            }

            const teamIds = [];
            if (teamIdValue) {
              const teamId = Number(teamIdValue);
              if (!Number.isSafeInteger(teamId) || teamId <= 0) {
                throw new Error('DEFAULT_TEAM_ID must be a positive numeric GitHub team ID.');
              }
              teamIds.push(teamId);
            }

            core.setOutput('team_assigned', teamIds.length > 0 ? 'true' : 'false');
            console.log(`Inviting ${username} to ${orgName}`);

            try {
              const user = await github.rest.users.getByUsername({ username });

              try {
                const membership = await github.request(
                  'GET /orgs/{org}/memberships/{username}',
                  { org: orgName, username }
                );
                if (membership.data.state === 'active') {
                  core.setOutput('result', 'already_member');
                  console.log(`${username} is already an organization member`);
                  return;
                }
                if (membership.data.state === 'pending') {
                  core.setOutput('result', 'already_invited');
                  console.log(`${username} already has a pending invitation`);
                  return;
                }
              } catch (membershipError) {
                if (membershipError.status !== 404) {
                  throw membershipError;
                }
              }

              await github.rest.orgs.createInvitation({
                org: orgName,
                invitee_id: user.data.id,
                role: 'direct_member',
                team_ids: teamIds
              });

              core.setOutput('result', 'invited');
              console.log(`Invitation sent to ${username}`);
            } catch (error) {
              const message = String(error.message || '').toLowerCase();
              console.error(`Error inviting ${username}: ${error.message}`);

              if (
                error.status === 422 &&
                message.includes('already') &&
                (message.includes('member') || message.includes('part of'))
              ) {
                core.setOutput('result', 'already_member');
                console.log(`${username} is already an organization member`);
                return;
              }

              if (
                error.status === 422 &&
                message.includes('already') &&
                (message.includes('invite') || message.includes('invitation'))
              ) {
                core.setOutput('result', 'already_invited');
                console.log(`${username} already has a pending invitation`);
                return;
              }

              if (error.status === 403) {
                throw new Error(
                  "Permission denied: ORG_INVITE_TOKEN must be authorized to manage organization invitations and teams."
                );
              }

              throw error;
            }

      - name: Post Welcome Comment
        if: steps.invite_user.outcome == 'success'
        uses: actions/github-script@v8
        env:
          INVITE_USERNAME: ${{ steps.load_request.outputs.username }}
          ISSUE_NUMBER: ${{ steps.load_request.outputs.issue_number }}
          INVITE_RESULT: ${{ steps.invite_user.outputs.result }}
          TEAM_ASSIGNED: ${{ steps.invite_user.outputs.team_assigned }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = process.env.INVITE_USERNAME;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const result = process.env.INVITE_RESULT;
            const teamAssigned = process.env.TEAM_ASSIGNED === 'true';

            const statusMessage = result === 'already_member'
              ? 'You are already a member of **Cloud Native Security Pakistan (CNSP)**.'
              : result === 'already_invited'
                ? 'Your invitation to **Cloud Native Security Pakistan (CNSP)** is already pending.'
                : 'Your invitation to join **Cloud Native Security Pakistan (CNSP)** has been sent!';
            const teamMessage = teamAssigned && result !== 'already_member'
              ? '\n\nThe invitation includes access to the **Newbie** team.'
              : '';

            const comment = `## 🎉 Welcome to CNSP, @${username}!

            ${statusMessage}${teamMessage}

            ### ✅ Next Steps:
            1. **Check your email** — Accept the GitHub invitation (or check [notifications](https://github.com/notifications))
            2. **Add yourself to the Member Map** — Create \`${username}.md\` in the \`/membersmap\` directory with your profile info
            3. **Submit a Pull Request** — Once merged, you're automatically promoted to **Member**! 🎉

            ### 🔗 Connect With Us
            - 🎯 [CNCF Bevy Chapter](https://community.cncf.io/cloud-native-security-pakistan/)
            - 📱 [WhatsApp Community](https://chat.whatsapp.com/F5Hf1ZwI22TK6EcV6zz4wo)
            - 💼 [LinkedIn](https://www.linkedin.com/company/cloud-native-security-pakistan)
            - 🐦 [Twitter/X](https://twitter.com/cnspk)

            If you do not receive the invitation within a few minutes, comment on this issue and tag an administrator.

            Welcome aboard! 🚀

            <!-- cnsp-invite-status -->`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            const existingComment = comments.find(candidate =>
              candidate.user.type === 'Bot' &&
              (
                candidate.body?.includes('<!-- cnsp-invite-status -->') ||
                candidate.body?.includes('There was an error processing your invitation request')
              )
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: comment
              });
            }

      - name: Post Error Comment
        if: failure() && steps.load_request.outputs.request_validated == 'true'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.load_request.outputs.issue_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const errorMessage = `❌ The automated invitation failed before it could be confirmed.

            An administrator should review the [workflow run](${runUrl}) for the exact error and retry this issue after correcting it.

            <!-- cnsp-invite-status -->`;

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              const existingComment = comments.find(candidate =>
                candidate.user.type === 'Bot' &&
                (
                  candidate.body?.includes('<!-- cnsp-invite-status -->') ||
                  candidate.body?.includes('There was an error processing your invitation request')
                )
              );

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: errorMessage
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: errorMessage
                });
              }
            } catch (error) {
              console.error(`Failed to post error comment: ${error.message}`);
            }

      - name: Close Issue
        if: steps.invite_user.outcome == 'success'
        uses: actions/github-script@v8
        env:
          ISSUE_NUMBER: ${{ steps.load_request.outputs.issue_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              state: 'closed',
              state_reason: 'completed'
            });
