name: Auto Invite to Organization

on:
  issues:
    types: [opened]

jobs:
  invite:
    # Only run if the issue has the invite-request label (added by the template)
    if: contains(github.event.issue.labels.*.name, 'invite-request')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:

      - name: Extract GitHub Username
        id: extract_username
        run: |
          # Extract username from issue body
          # The template format is: "### GitHub Username\n\nusername"
          BODY="${{ github.event.issue.body }}"
          
          # Pattern 1: Look for username after "### GitHub Username" heading (most common)
          USERNAME=$(echo "$BODY" | grep -A 2 "### GitHub Username" | grep -v "### GitHub Username" | grep -v "^$" | head -1 | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          
          # Pattern 2: Look for username after "GitHub Username" (any format)
          if [ -z "$USERNAME" ]; then
            USERNAME=$(echo "$BODY" | grep -A 2 "GitHub Username" | grep -v "GitHub Username" | grep -v "^$" | head -1 | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          fi
          
          # Pattern 3: Try to find github_username field (YAML format)
          if [ -z "$USERNAME" ]; then
            USERNAME=$(echo "$BODY" | grep -i "github_username" | sed 's/.*github_username[^:]*:\s*//i' | sed 's/[[:space:]]*$//' | head -1)
          fi
          
          # Clean up username (remove any markdown, quotes, or extra characters, but keep alphanumeric and hyphens)
          USERNAME=$(echo "$USERNAME" | sed 's/[^a-zA-Z0-9-]//g' | head -1)
          
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "Extracted username: $USERNAME"
          
          if [ -z "$USERNAME" ]; then
            echo "Error: Could not extract username from issue body"
            echo "Issue body preview:"
            echo "$BODY" | head -20
            exit 1
          fi

      - name: Get Team ID (if team name is provided)
        id: get_team_id
        if: steps.extract_username.outcome == 'success' && secrets.DEFAULT_TEAM_NAME != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const core = require('@actions/core');
            const orgName = 'Cloud-Native-Security-Pakistan';
            const teamName = '${{ secrets.DEFAULT_TEAM_NAME }}';
            
            try {
              // Get all teams in the organization
              const teams = await github.paginate(github.rest.teams.list, {
                org: orgName
              });
              
              // Find team by name (case-insensitive)
              const team = teams.find(t => t.name.toLowerCase() === teamName.toLowerCase() || t.slug.toLowerCase() === teamName.toLowerCase());
              
              if (team) {
                console.log(`Found team "${teamName}" with ID: ${team.id}`);
                core.setOutput('team_id', team.id.toString());
              } else {
                console.log(`Team "${teamName}" not found. Available teams: ${teams.map(t => t.name).join(', ')}`);
                core.setOutput('team_id', '');
              }
            } catch (error) {
              console.log(`Could not fetch teams: ${error.message}`);
              core.setOutput('team_id', '');
            }

      - name: Invite User to Organization
        id: invite_user
        if: steps.extract_username.outcome == 'success'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const username = '${{ steps.extract_username.outputs.username }}';
            const orgName = 'Cloud-Native-Security-Pakistan';
            
            // Get team ID from secret or from previous step
            // Default to "Newbie" team for all new members
            // Option 1: Use DEFAULT_TEAM_ID (numeric team ID) - preferred
            const teamIdFromSecret = '${{ secrets.DEFAULT_TEAM_ID }}';
            // Option 2: Use team ID from lookup (if DEFAULT_TEAM_NAME was provided)
            const teamIdFromLookup = '${{ steps.get_team_id.outputs.team_id }}';
            // Option 3: Try to find "Newbie" team automatically
            let newbieTeamId = '';
            
            // Prefer explicit team ID, fallback to looked-up ID, or try to find Newbie team
            let teamIdStr = teamIdFromSecret && teamIdFromSecret !== '' ? teamIdFromSecret : (teamIdFromLookup || '');
            
            // If no team specified, try to find "Newbie" team
            if (!teamIdStr || teamIdStr === '' || teamIdStr === 'null' || teamIdStr === 'undefined') {
              try {
                const teams = await github.paginate(github.rest.teams.list, {
                  org: orgName
                });
                const newbieTeam = teams.find(t => 
                  t.name.toLowerCase() === 'newbie' || t.slug.toLowerCase() === 'newbie'
                );
                if (newbieTeam) {
                  newbieTeamId = newbieTeam.id.toString();
                  teamIdStr = newbieTeamId;
                  console.log(`Auto-found Newbie team: ${newbieTeam.name} (ID: ${newbieTeam.id})`);
                }
              } catch (error) {
                console.log(`Could not auto-find Newbie team: ${error.message}`);
              }
            }
            
            const teamIds = teamIdStr && teamIdStr !== '' && teamIdStr !== 'null' && teamIdStr !== 'undefined' ? [parseInt(teamIdStr)] : [];
            
            console.log(`Inviting ${username} to ${orgName}...`);
            if (teamIds.length > 0) {
              console.log(`Will add to team ID: ${teamIds[0]} (Newbie team)`);
            } else {
              console.log(`Warning: No team specified - user will be added as direct member. Please set DEFAULT_TEAM_ID or DEFAULT_TEAM_NAME secret.`);
            }
            
            try {
              // Get user ID first (required for invitation)
              const user = await github.rest.users.getByUsername({
                username: username
              });
              
              console.log(`Found user ${username} with ID ${user.data.id}`);
              
              // Create invitation with optional team assignment
              const inviteResponse = await github.rest.orgs.createInvitation({
                org: orgName,
                invitee_id: user.data.id,
                role: 'direct_member',
                team_ids: teamIds  // Add to team if team ID is provided
              });
              
              const teamMsg = teamIds.length > 0 ? ` and added to team` : '';
              console.log(`Successfully invited ${username} to ${orgName}${teamMsg}`);
              return { success: true, message: `Invitation sent to ${username}${teamMsg}` };
              
            } catch (error) {
              console.error(`Error inviting ${username}:`, error.message);
              
              // Check if user is already a member
              if (error.status === 422 && (error.message.includes('already a member') || error.message.includes('User is already a member'))) {
                return { success: true, message: `${username} is already a member` };
              }
              
              // Check if invitation already exists
              if (error.status === 422 && (error.message.includes('invitation already exists') || error.message.includes('Invitation already exists'))) {
                return { success: true, message: `Invitation already sent to ${username}` };
              }
              
              // Check for permission errors
              if (error.status === 403) {
                throw new Error(`Permission denied: Token needs 'admin:org' scope. Current token has: ${error.response?.headers['x-oauth-scopes'] || 'unknown'}. Please update your ORG_INVITE_TOKEN with a token that has 'admin:org' permission.`);
              }
              
              throw error;
            }

      - name: Post Welcome Comment
        if: steps.invite_user.outcome == 'success'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = '${{ steps.extract_username.outputs.username }}';
            const issueNumber = context.payload.issue.number;
            const issueAuthor = context.payload.issue.user.login;
            
            const comment = `## 🎉 Welcome to CNSP, @${username}!
            
            Your invitation to join **Cloud Native Security Pakistan (CNSP)** has been sent! 
            
            You've been automatically added to the **Newbie** team. Once you add yourself to the member map, you'll be promoted to the **Member** team with access to more resources!
            
            ### Next Steps:
            1. **Check your email** - You should receive an invitation email from GitHub
            2. **Accept the invitation** - Click the link in the email or check your [GitHub notifications](https://github.com/notifications)
            3. **Become a Member** - Choose one method:
               
               **Option A: GitHub PR Method (Recommended - Earn Extra Points! ⭐)**
               - Create a file \`${username}.md\` (or \`${username}.json\`) in the \`/membersmap\` directory
               - Include your name, location, interests, and GitHub profile
               - Submit a Pull Request to add yourself to the community map
               - **Bonus**: You'll earn extra points for submitting via PR!
               
               **Option B: Google Form Method**
               - Fill out the [CNSP Member Registration Form](YOUR_GOOGLE_FORM_LINK)
               - Your information will be added to our database and appear on the website map
               
               Both methods require admin approval. Once approved, you'll be promoted to the **Member** team!
            4. **Join our community** - Connect with us on our social platforms below!
                        
            ### Join Our Community
            
            🎯 **CNCF Bevy Chapter**: [Join our CNCF Community](https://community.cncf.io/cloud-native-security-pakistan/) - Connect with 257+ members, attend events, and participate in discussions
            
            📱 **WhatsApp Community**: [Join our WhatsApp Community](https://chat.whatsapp.com/F5Hf1ZwI22TK6EcV6zz4wo) - Connect with members, get updates, and participate in discussions
            
            🌐 **Social Media**:
            - [LinkedIn](https://www.linkedin.com/company/cloud-native-security-pakistan) - Follow us for updates and announcements
            - [Twitter/X](https://twitter.com/cnspk) - Stay updated with the latest news
            - [GitHub Organization](https://github.com/Cloud-Native-Security-Pakistan) - Explore our projects and repositories
            
            ### Need Help?
            If you don't receive the invitation within a few minutes, please let us know by commenting on this issue.
            
            Welcome aboard! 🚀
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });
            
            console.log(`Posted welcome comment on issue #${issueNumber}`);

      - name: Post Error Comment
        if: failure()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const errorMsg = `❌ There was an error processing your invitation request.
            
            **Possible issues:**
            - Invalid or missing GitHub username
            - User account doesn't exist
            
            Please check that you provided a valid GitHub username and try again, or contact an administrator.
            
            If this issue persists, please take one admin;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: errorMsg
            });

      - name: Close Issue
        if: steps.invite_user.outcome == 'success'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed'
            });
            
            console.log(`Closed issue #${context.payload.issue.number}`);

