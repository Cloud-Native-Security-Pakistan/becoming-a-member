name: Auto Invite to Organization

on:
  issues:
    types: [opened]

jobs:
  invite:
    # Only run if the issue has the invite-request label (added by the template)
    if: contains(github.event.issue.labels.*.name, 'invite-request')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:

      - name: Extract GitHub Username
        id: extract_username
        run: |
          # Extract username from issue body
          # The template format is: "### GitHub Username\n\nusername"
          BODY="${{ github.event.issue.body }}"
          
          # Pattern 1: Look for username after "### GitHub Username" heading (most common)
          USERNAME=$(echo "$BODY" | grep -A 2 "### GitHub Username" | grep -v "### GitHub Username" | grep -v "^$" | head -1 | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          
          # Pattern 2: Look for username after "GitHub Username" (any format)
          if [ -z "$USERNAME" ]; then
            USERNAME=$(echo "$BODY" | grep -A 2 "GitHub Username" | grep -v "GitHub Username" | grep -v "^$" | head -1 | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          fi
          
          # Pattern 3: Try to find github_username field (YAML format)
          if [ -z "$USERNAME" ]; then
            USERNAME=$(echo "$BODY" | grep -i "github_username" | sed 's/.*github_username[^:]*:\s*//i' | sed 's/[[:space:]]*$//' | head -1)
          fi
          
          # Clean up username (remove any markdown, quotes, or extra characters, but keep alphanumeric and hyphens)
          USERNAME=$(echo "$USERNAME" | sed 's/[^a-zA-Z0-9-]//g' | head -1)
          
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "Extracted username: $USERNAME"
          
          if [ -z "$USERNAME" ]; then
            echo "Error: Could not extract username from issue body"
            echo "Issue body preview:"
            echo "$BODY" | head -20
            exit 1
          fi

      - name: Invite User to Organization
        id: invite_user
        if: steps.extract_username.outcome == 'success'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN }}
          script: |
            const username = '${{ steps.extract_username.outputs.username }}';
            const orgName = 'Cloud-Native-Security-Pakistan';
            
            console.log(`Inviting ${username} to ${orgName}...`);
            
            try {
              // Get user ID first (required for invitation)
              const user = await github.rest.users.getByUsername({
                username: username
              });
              
              console.log(`Found user ${username} with ID ${user.data.id}`);
              
           
              const inviteResponse = await github.rest.orgs.createInvitation({
                org: orgName,
                invitee_id: user.data.id,
                role: 'direct_member'
              });
              
              console.log(`Successfully invited ${username} to ${orgName}`);
              return { success: true, message: `Invitation sent to ${username}` };
              
            } catch (error) {
              console.error(`Error inviting ${username}:`, error.message);
              
              // Check if user is already a member
              if (error.status === 422 && (error.message.includes('already a member') || error.message.includes('User is already a member'))) {
                return { success: true, message: `${username} is already a member` };
              }
              
              // Check if invitation already exists
              if (error.status === 422 && (error.message.includes('invitation already exists') || error.message.includes('Invitation already exists'))) {
                return { success: true, message: `Invitation already sent to ${username}` };
              }
              
              // Check for permission errors
              if (error.status === 403) {
                throw new Error(`Permission denied: Token needs 'admin:org' scope. Current token has: ${error.response?.headers['x-oauth-scopes'] || 'unknown'}. Please update your ORG_INVITE_TOKEN with a token that has 'admin:org' permission.`);
              }
              
              throw error;
            }

      - name: Post Welcome Comment
        if: steps.invite_user.outcome == 'success'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = '${{ steps.extract_username.outputs.username }}';
            const issueNumber = context.payload.issue.number;
            const issueAuthor = context.payload.issue.user.login;
            
            const comment = `## 🎉 Welcome to CNSP, @${username}!
            
            Your invitation to join **Cloud Native Security Pakistan (CNSP)** has been sent! 
            
            ### Next Steps:
            1. **Check your email** - You should receive an invitation email from GitHub
            2. **Accept the invitation** - Click the link in the email or check your [GitHub notifications](https://github.com/notifications)
                        
            ### CNCF Resources
            - [CNCF Security Technical Advisory Group](https://github.com/cncf/tag-security)
            - [CNCF Projects](https://www.cncf.io/projects/)
            - [CNCF Security Best Practices](https://www.cncf.io/blog/category/security/)
            
            ### Need Help?
            If you don't receive the invitation within a few minutes, please let us know by commenting on this issue.
            
            Welcome aboard! 🚀
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });
            
            console.log(`Posted welcome comment on issue #${issueNumber}`);

      - name: Post Error Comment
        if: failure()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const errorMsg = `❌ There was an error processing your invitation request.
            
            **Possible issues:**
            - Invalid or missing GitHub username
            - User account doesn't exist
            
            Please check that you provided a valid GitHub username and try again, or contact an administrator.
            
            If this issue persists, please take one admin;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: errorMsg
            });

      - name: Close Issue
        if: steps.invite_user.outcome == 'success'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed'
            });
            
            console.log(`Closed issue #${context.payload.issue.number}`);

